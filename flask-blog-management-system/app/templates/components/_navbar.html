<header class="sticky-top fp-navbar">
  <nav class="navbar navbar-expand-lg py-0" aria-label="Primary navigation">
    <div class="container">
      <!-- Zone 1: Single-line Brand Wordmark -->
      <a class="fp-brand" href="{{ url_for('main.index') }}">{{ site_name }}</a>

      <button
        class="navbar-toggler border-0 shadow-none"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#primaryNavCollapse"
        aria-controls="primaryNavCollapse"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="primaryNavCollapse">
        <!-- Zone 2: Concise single-line navigation links -->
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-2">
          <li class="nav-item">
            <a
              class="nav-link fp-nav-link {% if request.endpoint == 'main.index' %}active{% endif %}"
              href="{{ url_for('main.index') }}"
            >Journal</a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link fp-nav-link {% if request.endpoint == 'main.about' %}active{% endif %}"
              href="{{ url_for('main.about') }}"
            >About</a>
          </li>
          {% if current_user.is_authenticated %}
          <li class="nav-item">
            <a
              class="nav-link fp-nav-link {% if request.endpoint == 'posts.dashboard' %}active{% endif %}"
              href="{{ url_for('posts.dashboard') }}"
            >Dashboard</a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link fp-nav-link {% if request.endpoint == 'profile.view' and request.view_args.get('username') == current_user.username %}active{% endif %}"
              href="{{ url_for('profile.view', username=current_user.username) }}"
            >Profile</a>
          </li>
          {% endif %}
        </ul>

        <!-- Zone 3: User account & primary CTA -->
        <div class="d-flex align-items-center gap-3 pt-2 pt-lg-0">
          {% if current_user.is_authenticated %}
            <div class="dropdown">
              <button
                class="btn btn-fp-outline dropdown-toggle d-inline-flex align-items-center gap-2"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <span class="fp-avatar" style="width: 24px; height: 24px; font-size: 0.68rem;">{{ current_user.initials }}</span>
                <span class="text-truncate" style="max-width: 140px;">{{ current_user.full_name }}</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow-sm border">
                <li>
                  <a class="dropdown-item" href="{{ url_for('profile.view', username=current_user.username) }}">
                    <i class="bi bi-person me-2"></i>Public Profile
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" href="{{ url_for('profile.edit') }}">
                    <i class="bi bi-sliders me-2"></i>Edit Profile
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" href="{{ url_for('posts.dashboard') }}">
                    <i class="bi bi-journal-text me-2"></i>My Posts
                  </a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <form method="post" action="{{ url_for('auth.logout') }}" class="m-0">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                    <button type="submit" class="dropdown-item text-danger">
                      <i class="bi bi-box-arrow-right me-2"></i>Sign Out
                    </button>
                  </form>
                </li>
              </ul>
            </div>
            <a class="btn btn-fp-primary" href="{{ url_for('posts.create') }}">
              <i class="bi bi-pencil-square me-1"></i>Write Post
            </a>
          {% else %}
            <a class="fp-nav-link text-decoration-none" href="{{ url_for('auth.login') }}">Sign In</a>
            <a class="btn btn-fp-primary" href="{{ url_for('auth.register') }}">Create Account</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>
</header>
