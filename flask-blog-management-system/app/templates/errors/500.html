{% extends "base.html" %}
{% block title %}500 Server Error — {{ site_name }}{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container">
    <div class="fp-panel text-center py-5 mx-auto" style="max-width: 560px;">
      <p class="small text-muted mb-2 tabular-nums">Error 500</p>
      <h1 class="font-serif h2 mb-3">Unexpected Server Error</h1>
      <p class="text-muted mb-4">Something went wrong on our end. Please try again in a moment.</p>
      <a href="{{ url_for('main.index') }}" class="btn btn-fp-primary">Return to Journal</a>
    </div>
  </div>
</section>
{% endblock %}
